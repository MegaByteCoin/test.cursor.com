<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Zona — Регистрация</title>
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">🤖 AI Zona</div>
        <h2>Регистрация</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Минимум 3 символа">
            </div>
            <div class="form-group">
                <label for="display_name">Отображаемое имя</label>
                <input type="text" id="display_name" name="display_name" placeholder="Как вас называть?">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Минимум 4 символа">
            </div>
            <button type="submit" class="btn-primary">Создать аккаунт</button>
        </form>
        <p class="auth-link">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>
<div id="toast-container"></div>
<script src="/static/js/toast.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const display_name = document.getElementById('display_name').value;
    const password = document.getElementById('password').value;
    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, display_name, password})
        });
        const data = await res.json();
        if (res.ok) {
            showToast('Регистрация успешна!', 'success');
            setTimeout(() => window.location.href = '/app', 500);
        } else {
            showToast(data.error || 'Ошибка регистрации', 'error');
        }
    } catch (err) {
        showToast('Ошибка соединения', 'error');
    }
});
</script>
</body>
</html>
